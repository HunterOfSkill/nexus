#reels .fs{position:absolute;top:0;bottom:0;width:14px;background:repeating-linear-gradient(180deg,transparent 0 10px,rgba(255,255,255,.22) 10px 24px,transparent 24px 34px);animation:fscr 6s linear infinite}
#reels .fl1{left:10px}#reels .fr1{right:10px;animation-direction:reverse}
@keyframes fscr{from{background-position:0 0}to{background-position:0 34px}}
#reels .ribbon{position:absolute;left:-20%;top:62%;width:140%;height:84px;transform:rotate(-14deg);opacity:.32;background:
 repeating-linear-gradient(90deg,transparent 0 8px,rgba(255,255,255,.5) 8px 18px,transparent 18px 26px) 0 7px/26px 10px repeat-x,
 repeating-linear-gradient(90deg,transparent 0 8px,rgba(255,255,255,.5) 8px 18px,transparent 18px 26px) 0 67px/26px 10px repeat-x,
 repeating-linear-gradient(90deg,rgba(141,127,208,.5) 0 96px,transparent 96px 104px) 0 22px/104px 40px repeat-x,
 #05030a;animation:rib 40s linear infinite}
@keyframes rib{from{background-position:0 7px,0 67px,0 22px,0 0}to{background-position:-104px 7px,-104px 67px,-104px 22px,0 0}}
#reels .reel{position:absolute;opacity:.3;animation:rspin 70s linear infinite}
#reels .r1{width:min(60vw,380px);right:-14%;top:12%}
#reels .r2{width:min(40vw,250px);left:-12%;top:48%;animation-duration:50s;animation-direction:reverse}
#reels .r3{width:min(34vw,210px);right:8%;bottom:-6%;animation-duration:60s}
@keyframes rspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#reels *{animation:none!important}}
/* ---------- Themen-Hintergründe (eigene Kategorien) ---------- */
.bg-cust{background:radial-gradient(ellipse at 50% 110%,color-mix(in srgb,var(--cc,#a597e6) 34%,transparent),transparent 60%),linear-gradient(165deg,color-mix(in srgb,var(--cc,#a597e6) 20%,#0a0b11),#07080c 70%)}

#thm{display:none;position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden;--c:var(--cc,#a597e6)}
body[data-custom] #thm{display:block}
#thm .e{position:absolute;left:var(--x);top:var(--y);display:block;will-change:transform}
@keyframes spinD{to{transform:rotate(360deg)}}
/* Bücher */
#thm.th-books .e{top:auto;bottom:-80px;width:var(--s);height:calc(var(--s)*1.3);background:linear-gradient(#f6efd8,#e6dab4);border-radius:2px;opacity:.3;box-shadow:0 0 14px rgba(255,235,180,.25);animation:bkUp var(--d) linear var(--dl) infinite}

/* Musik */

#thm.th-stamps .e.pm{top:var(--y);width:var(--s);height:var(--s);border:3px solid rgba(255,255,255,.25);border-radius:50%;background:repeating-linear-gradient(transparent 0 7px,rgba(255,255,255,.22) 7px 9px) 100% 50%/90% 70% no-repeat;filter:none;opacity:.7;transform:rotate(var(--r));animation:pmPulse 9s ease-in-out var(--dl) infinite}
@keyframes stFall{0%{transform:translate(0,0) rotate(var(--r))}25%{transform:translate(34px,30vh) rotate(calc(var(--r) + 16deg))}50%{transform:translate(-24px,62vh) rotate(calc(var(--r) - 14deg))}75%{transform:translate(30px,94vh) rotate(calc(var(--r) + 12deg))}100%{transform:translate(0,128vh) rotate(var(--r))}}
@keyframes pmPulse{0%,100%{opacity:.12}50%{opacity:.6}}
/* Emoji-Thema */
#thm.th-emoji .e{top:auto;bottom:-70px;font-size:var(--s);line-height:1;opacity:.3;animation:emUp var(--d) ease-in-out var(--dl) infinite}
#thm.th-emoji .e::before{content:var(--em)}
@keyframes emUp{0%{transform:translate(0,0) rotate(-10deg);opacity:0}8%{opacity:.35}25%{transform:translate(26px,-30vh) rotate(8deg)}50%{transform:translate(-22px,-62vh) rotate(-8deg)}75%{transform:translate(24px,-94vh) rotate(8deg)}100%{transform:translate(0,-125vh) rotate(-6deg);opacity:0}}
/* Sonst: Leuchtkugeln */
#thm.th-orbs .e{top:auto;bottom:-12vh;width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 55%,#fff),var(--c) 60%,transparent 72%);opacity:.3;animation:orbUp var(--d) ease-in-out var(--dl) infinite}

/* ---------- Schnürsenkel (Schuhe) ---------- */
#laces{display:none;position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:-1;opacity:.5}
body[data-cat="schuhe"] #laces{display:block}
#laces .lp{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:1;animation:lwind 14s ease-in-out infinite alternate}
@keyframes lwind{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.lace{display:none;position:absolute;left:-10px;top:-9px;width:calc(100% + 36px);height:auto;pointer-events:none;overflow:visible;z-index:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
body[data-cat="schuhe"] .lace{display:block}
body[data-cat="schuhe"] .ttl{margin:18px 0 18px}
body[data-cat="schuhe"] .ttl h1{position:relative;z-index:6;text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.7);animation:trev 3.6s ease-in-out .15s both}
@keyframes trev{from{clip-path:inset(-20% 100% -20% -2%)}to{clip-path:inset(-20% -2% -20% -2%)}}
.lace .tl{fill:none;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:1;animation:ltw 10s ease-in-out var(--dl,0s) infinite}
@keyframes ltw{0%{stroke-dashoffset:1}36%{stroke-dashoffset:0}64%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
@media (prefers-reduced-motion:reduce){#laces .lp,.lace .tl{animation:none;stroke-dashoffset:0}body[data-cat="schuhe"] .ttl h1{animation:none}}

body[data-cat="messer"] #forge{display:block}
@keyframes hit{0%{transform:rotate(0)}6%{transform:rotate(-4deg)}50%{transform:rotate(-42deg)}80%{transform:rotate(-42deg)}100%{transform:rotate(0)}}

background:color-mix(in srgb,var(--surface) 40%,transparent);-webkit-backdrop-filter:blur(var(--bl));backdrop-filter:blur(var(--bl))}

}

/* ---------- Adapter: Konto-Speicher (Firestore) ---------- */
/* Schreibvorgänge warten ohne Internet ewig auf die Bestätigung; die Änderung ist dann aber schon gemerkt und wird später gesendet. */
const soft = (p) => new Promise((res, rej) => { const t = setTimeout(res, 3500); p.then(() => { clearTimeout(t); res(); }, (e) => { clearTimeout(t); rej(e); }); });
const clean = (d) => JSON.parse(JSON.stringify(d));
function cloudAdapters(uid) {
  const { collection, doc, setDoc, deleteDoc, getDoc, getDocs, getDocFromCache, onSnapshot } = FB.fs;
  const col = (n) => collection(fdb, "users", uid, n);
  const queue = []; let running = 0, pendingRender = false;
  function kick() {
    while (running < 4 && queue.length) {
      const id = queue.shift(); running++;
      const ref = doc(fdb, "users", uid, "photos", id);
      getDocFromCache(ref).catch(() => getDoc(ref)).then(async (s) => {
        const d = s && s.exists && s.exists() ? s.data() : null;
        if (d && d.d) { const b = await blobFromData(d.d); SS.setBlob(id, URL.createObjectURL(b)); if (!pendingRender) { pendingRender = true; setTimeout(() => { pendingRender = false; SS.refresh(); }, 80); } }
      }).catch(() => {}).then(() => { running--; kick(); });
    }
  }
  function want(ids) { ids.forEach((id) => { if (id && !SS.hasBlob(id) && queue.indexOf(id) === -1) queue.push(id); }); kick(); }
  const dbA = {
    collection(n) {
      return {
        doc(id) {
          const r = id ? doc(fdb, "users", uid, n, id) : doc(col(n));
          return { id: r.id, set: (d) => soft(setDoc(r, clean(d))), delete: () => soft(deleteDoc(r)) };
        },
        onSnapshot(ok, err) {
          return onSnapshot(col(n), { includeMetadataChanges: true }, (snap) => {
            if (n === "items") snap.docs.forEach((d) => want((d.data() || {}).images || []));
            ok(snap);
          }, err);
        },
      };
    },
  };
  const assets = {
    async upload(blob) {
      const data = await pack(blob);
      const ref = doc(col("photos"));
      await soft(setDoc(ref, { d: data, ts: Date.now() }));
      const b = await blobFromData(data);
      SS.setBlob(ref.id, URL.createObjectURL(b));
      return { id: ref.id };
    },
    delete(id) { return soft(deleteDoc(doc(fdb, "users", uid, "photos", id))); },
  };
  return {
    kind: "cloud", db: dbA, assets,
    async readAll(n) { const s = await getDocs(col(n)); return s.docs.map((d) => Object.assign({ id: d.id }, d.data())); },
    async photoData(id) {
      const ref = doc(fdb, "users", uid, "photos", id);
      const s = await getDocFromCache(ref).catch(() => getDoc(ref));
      return s && s.exists() ? s.data().d : null;
    },
    async wipe() {
      for (const n of ["items", "cats", "photos"]) {
        const s = await getDocs(col(n));
        for (const d of s.docs) await deleteDoc(d.ref);
      }
    },
  };
}

/* ---------- Adapter: Gerät (ohne Konto) ---------- */
function localSrc(ad) {
  const dbL = ad[0], asL = ad[1];
  return {
    kind: "guest", db: dbL, assets: asL,
    readAll(n) {
      return new Promise((res) => {
        let done = false;
        dbL.collection(n).onSnapshot((s) => { if (done) return; done = true; res(s.docs.map((d) => Object.assign({ id: d.id }, d.data()))); });
      });
    },
    async photoData(id) {
      const u = SS.blobUrl(id); if (!u) return null;
      return dataFromBlob(await (await fetch(u)).blob());
    },
    async wipe() {
      for (const n of ["items", "cats"]) { const a = await this.readAll(n); for (const o of a) await dbL.collection(n).doc(o.id).delete(); }
    },
  };
}

/* ---------- Sicherung / Übernahme ---------- */
async function exportData(src) {
  const cats = await src.readAll("cats");
  const items = await src.readAll("items");
  for (const it of items) {
    const ph = [];
    for (const id of it.images || []) { try { const d = await src.photoData(id); if (d) ph.push(d); } catch (e) {} }
    it.photos = ph; delete it.images;
  }
  return { app: "meine-sammlung", v: 1, date: new Date().toISOString(), cats, items };
}
async function importData(dst, data, onProg) {
  if (!data || data.app !== "meine-sammlung" || !Array.isArray(data.items)) throw new Error("bad");
  for (const c of data.cats || []) { const id = c.id; const o = Object.assign({}, c); delete o.id; await dst.db.collection("cats").doc(id).set(o); }
  let n = 0;
  for (const it of data.items) {
    const id = it.id; const o = Object.assign({}, it); delete o.id;
    const ids = [];
    for (const p of o.photos || []) { try { const r = await dst.assets.upload(await blobFromData(p)); ids.push(r.id); } catch (e) {} }
    delete o.photos; o.images = ids;
    await dst.db.collection("items").doc(id).set(o);
    n++; if (onProg) onProg(n, data.items.length);
  }
  return n;
}
function download(name, text) {
  const b = new Blob([text], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ---------- Anmelde-Fenster ---------- */
function openAuth(tab, required) {
  let t = tab || "in";
  dAuth.dataset.req = required ? "1" : "";
  function draw(msg, ok) {
    $("vAuth").innerHTML =
      '<h2 class="acct-h">' + esc(tt("loginTitle")) + "</h2><p class=\"acct-p\">" + esc(tt("loginSub")) + "</p>" +
      '<div class="acct-tabs" role="tablist"><button type="button" role="tab" data-tab="in" class="' + (t === "in" ? "on" : "") + '">' + esc(tt("tabIn")) + '</button><button type="button" role="tab" data-tab="up" class="' + (t === "up" ? "on" : "") + '">' + esc(tt("tabUp")) + "</button></div>" +
      '<form id="fAuth" novalidate><label for="au-mail">' + esc(tt("email")) + '</label><input id="au-mail" type="email" inputmode="email" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required value="' + esc(draw.mail || "") + '">' +
      '<label for="au-pw">' + esc(tt("pw")) + '</label><input id="au-pw" type="password" autocomplete="' + (t === "in" ? "current-password" : "new-password") + '" required>' +
      (t === "up" ? '<p class="acct-hint">' + esc(tt("pwHint")) + '</p><label for="au-pw2">' + esc(tt("pw2")) + '</label><input id="au-pw2" type="password" autocomplete="new-password" required>' : "") +
      '<p class="acct-msg' + (ok ? " ok" : "") + '" id="au-msg" role="alert">' + esc(msg || "") + "</p>" +
      '<div class="acts acct-acts"><button type="submit" class="primary" id="au-go">' + esc(tt(t === "in" ? "btnIn" : "btnUp")) + "</button></div></form>" +
      '<div class="acct-links">' + (t === "in" ? '<button type="button" class="acct-link" data-do="forgot">' + esc(tt("forgot")) + "</button>" : "") +
      (required ? '<button type="button" class="acct-link" data-do="guest">' + esc(tt("guest")) + "</button>" : '<button type="button" class="acct-link" data-do="close">' + esc(tt("close")) + "</button>") + "</div>";
  }
  draw();
  const v = $("vAuth");
  v.onclick = (e) => {
    const tb = e.target.closest("[data-tab]"); if (tb) { draw.mail = ($("au-mail") || {}).value || ""; t = tb.dataset.tab; draw(); return; }
    const d = e.target.closest("[data-do]"); if (!d) return;
    if (d.dataset.do === "close") dAuth.close();
    if (d.dataset.do === "guest") { dAuth.dataset.req = ""; dAuth.close(); startGuest(); }
    if (d.dataset.do === "forgot") {
      const mail = ($("au-mail").value || "").trim();
      if (!mail) { $("au-msg").className = "acct-msg"; $("au-msg").textContent = tt("needEmail"); return; }
      FB.authMod.sendPasswordResetEmail(auth, mail).then(() => { $("au-msg").className = "acct-msg ok"; $("au-msg").textContent = tt("resetSent"); },
        (er) => { $("au-msg").className = "acct-msg"; $("au-msg").textContent = /user-not-found/.test((er && er.code) || "") ? tt("resetSent") : authMsg(er); });
    }
  };
  v.onsubmit = async (e) => {
    e.preventDefault();
    const mail = $("au-mail").value.trim(), pw = $("au-pw").value;
    const msg = (m) => { $("au-msg").className = "acct-msg"; $("au-msg").textContent = m; };
    if (!mail || !/^\S+@\S+\.\S+$/.test(mail)) return msg(tt("e_invalid"));
    if (t === "up") { if (pw.length < 8) return msg(tt("e_weak")); if (pw !== $("au-pw2").value) return msg(tt("e_mismatch")); }
    else if (!pw) return msg(tt("e_cred"));
    $("au-go").disabled = true; msg(tt("working"));
    try {
      if (t === "up") await FB.authMod.createUserWithEmailAndPassword(auth, mail, pw);
      else await FB.authMod.signInWithEmailAndPassword(auth, mail, pw);
      try { localStorage.removeItem("ss-guest"); } catch (er) {}
      location.reload();
    } catch (er) { $("au-go").disabled = false; msg(authMsg(er)); }
  };
  if (!dAuth.open) dAuth.showModal();
}

/* ---------- Konto-Fenster ---------- */
function openAcct() {
  const guest = mode !== "cloud";
  $("vAcct").innerHTML =
    '<h2 class="acct-h">' + esc(tt("acct")) + "</h2>" +
    (guest
      ? '<p class="acct-p">' + esc(tt("guestInfo")) + "</p>" + (hasCfg ? '<div class="acts acct-acts"><button type="button" class="primary" data-a="login">' + esc(tt("guestBarBtn")) + "</button></div>" : '<p class="acct-hint"><b>' + esc(tt("cfgTitle")) + "</b><br>" + esc(tt("cfgText")) + "</p>")
      : '<p class="acct-p">' + esc(tt("signedIn")) + " <b>" + esc((user && user.email) || "") + "</b></p><p class=\"acct-hint\">" + esc(tt("saved")) + "</p>") +
    '<div class="acct-list"><button type="button" class="ghost" data-a="export">' + esc(tt("export")) + '</button><button type="button" class="ghost" data-a="import">' + esc(tt("import")) + "</button>" +
    (guest ? "" : '<button type="button" class="ghost" data-a="out">' + esc(tt("signOut")) + '</button><button type="button" class="ghost danger" data-a="del">' + esc(tt("delAcct")) + "</button>") + "</div>" +
    '<div id="acct-del" hidden><p class="acct-msg">' + esc(tt("delWarn")) + '</p><label for="ad-pw">' + esc(tt("delPw")) + '</label><input id="ad-pw" type="password" autocomplete="current-password"><p class="acct-msg" id="ad-msg" role="alert"></p><div class="acts acct-acts"><button type="button" class="ghost" data-a="delno">' + esc(tt("cancel")) + '</button><button type="button" class="primary danger" data-a="delgo">' + esc(tt("delGo")) + "</button></div></div>" +
    '<p class="acct-msg ok" id="ac-msg" role="status"></p><input type="file" id="ac-file" accept="application/json,.json" hidden>' +
    '<div class="acts acct-acts"><button type="button" class="ghost" data-a="x">' + esc(tt("close")) + "</button></div>";
  const v = $("vAcct");
  const say = (m, bad) => { const e = $("ac-msg"); e.className = "acct-msg" + (bad ? "" : " ok"); e.textContent = m; };
  v.onclick = async (e) => {
    const b = e.target.closest("[data-a]"); if (!b) return; const a = b.dataset.a;
    if (a === "x") dAcct.close();
    if (a === "login") { dAcct.close(); openAuth("in", false); }
    if (a === "export") {
      try { const d = await exportData(cur); download("nexus-sicherung-" + new Date().toISOString().slice(0, 10) + ".json", JSON.stringify(d)); say(tt("expDone")); } catch (er) { say(tt("e_other"), 1); }
    }
    if (a === "import") $("ac-file").click();
    if (a === "out") { await FB.authMod.signOut(auth); try { localStorage.removeItem("ss-guest"); } catch (er) {} location.reload(); }
    if (a === "del") { $("acct-del").hidden = false; $("ad-pw").focus(); }
    if (a === "delno") $("acct-del").hidden = true;
    if (a === "delgo") {
      const pw = $("ad-pw").value; const m = $("ad-msg");
      if (!pw) { m.textContent = tt("e_cred"); return; }
      b.disabled = true; m.textContent = tt("working");
      try {
        const cred = FB.authMod.EmailAuthProvider.credential(user.email, pw);
        await FB.authMod.reauthenticateWithCredential(auth.currentUser, cred);
        await cur.wipe();
        await FB.authMod.deleteUser(auth.currentUser);
        try { Object.keys(localStorage).filter((k) => /^ss-/.test(k)).forEach((k) => localStorage.removeItem(k)); } catch (er) {}
        location.reload();
      } catch (er) { b.disabled = false; m.textContent = authMsg(er); }
    }
  };
  $("ac-file").onchange = async (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    say(tt("impAsk"));
    try {
      const data = JSON.parse(await f.text());
      const n = await importData(cur, data, (a, b) => say(tt("migBusy", { a, b })));
      say(tt("impDone", { n })); SS.refresh();
    } catch (er) { say(er && er.message === "bad" ? tt("impBad") : tt("impBad"), 1); }
    e.target.value = "";
  };
  if (!dAcct.open) dAcct.showModal();
}

/* ---------- Konto-Knopf und Hinweisleiste ---------- */
function drawAcctBtn() {
  let b = $("bAcct");
  if (!b) {
    b = document.createElement("button"); b.type = "button"; b.id = "bAcct"; b.className = "tbtn acctbtn";
    const ctl = document.querySelector(".ctl"); ctl.insertBefore(b, ctl.firstChild);
    b.addEventListener("click", openAcct);
  }
  const ic = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.2 3.6-7 8-7s8 2.800 8 7"/></svg>';
  b.innerHTML = ic + "<span>" + esc(mode === "cloud" ? tt("acct") : tt("acctGuest")) + "</span>";
  b.classList.toggle("in", mode === "cloud");
  let bar = $("acctbar");
  if (mode !== "cloud") {
    if (!bar) { bar = document.createElement("div"); bar.id = "acctbar"; const st = $("status"); st.parentNode.insertBefore(bar, st); bar.addEventListener("click", (e) => { if (e.target.closest("button")) { hasCfg ? openAuth("up", false) : openAcct(); } }); }
    bar.innerHTML = "<span>" + esc(tt("guestBar")) + '</span><button type="button">' + esc(hasCfg ? tt("guestBarBtn") : tt("acct")) + "</button>";
  } else if (bar) bar.remove();
}
if ($("lang")) $("lang").addEventListener("change", () => setTimeout(() => { if (mode !== "none") drawAcctBtn(); }, 0));

/* ---------- Start ---------- */
async function startGuest() {
  try { localStorage.setItem("ss-guest", "1"); } catch (e) {}
  mode = "guest";
  guestAdapters = await SS.makeLocal();
  cur = localSrc(guestAdapters);
  SS.boot(guestAdapters[0], guestAdapters[1]);
  drawAcctBtn();
}
async function startCloud(u) {
  user = u; mode = "cloud";
  cur = cloudAdapters(u.uid);
  SS.boot(cur.db, cur.assets);
  drawAcctBtn();
  maybeMigrate(u.uid);
}
async function maybeMigrate(uid) {
  try {
    if (localStorage.getItem("ss-nomig-" + uid)) return;
    const ad = await SS.makeLocal(); const src = localSrc(ad);
    const items = await src.readAll("items");
    if (!items.length) return;
    $("vMig").innerHTML = '<h2 class="acct-h">' + esc(tt("migTitle")) + '</h2><p class="acct-p">' + esc(tt("migText", { n: items.length })) + '</p><p class="acct-msg ok" id="mg-msg"></p>' +
      '<div class="acct-list"><button type="button" class="primary" data-m="yes">' + esc(tt("migYes")) + '</button><button type="button" class="ghost" data-m="later">' + esc(tt("migLater")) + '</button><button type="button" class="ghost" data-m="never">' + esc(tt("migNever")) + "</button></div>";
    $("vMig").onclick = async (e) => {
      const b = e.target.closest("[data-m]"); if (!b) return; const a = b.dataset.m;
      if (a === "later") dMig.close();
      if (a === "never") { try { localStorage.setItem("ss-nomig-" + uid, "1"); } catch (er) {} dMig.close(); }
      if (a === "yes") {
        dMig.dataset.busy = "1"; $("vMig").querySelectorAll("button").forEach((x) => (x.disabled = true));
        try {
          const data = await exportData(src);
          const n = await importData(cur, data, (x, y) => { $("mg-msg").textContent = tt("migBusy", { a: x, b: y }); });
          await src.wipe();
          dMig.dataset.busy = ""; dMig.close(); toast(tt("migDone", { n })); SS.refresh();
        } catch (er) { dMig.dataset.busy = ""; $("vMig").querySelectorAll("button").forEach((x) => (x.disabled = false)); $("mg-msg").className = "acct-msg"; $("mg-msg").textContent = tt("e_other"); }
      }
    };
    whenSplashGone(() => { if (!dMig.open) dMig.showModal(); });
  } catch (e) {}
}

async function main() {
  if (!hasCfg) { await startGuest(); return; }
  try {
    const [app, a, f] = await Promise.all([import(FB_BASE + "firebase-app.js"), import(FB_BASE + "firebase-auth.js"), import(FB_BASE + "firebase-firestore.js")]);
    FB = { app, authMod: a, fs: f };
    const fa = app.initializeApp(cfg);
    auth = a.getAuth(fa);
    try { fdb = f.initializeFirestore(fa, { localCache: f.persistentLocalCache({ tabManager: f.persistentMultipleTabManager() }) }); }
    catch (e) { fdb = f.getFirestore(fa); }
  } catch (e) { await startGuest(); return; }
  let first = true;
  {
    FB.authMod.onAuthStateChanged(auth, (u) => {
      if (!first) return; first = false;
      if (u) startCloud(u);
      else {
        let g = false; try { g = localStorage.getItem("ss-guest") === "1"; } catch (e) {}
        if (g) startGuest(); else whenSplashGone(() => openAuth("in", true));
      }
    });
  }
}
main();
